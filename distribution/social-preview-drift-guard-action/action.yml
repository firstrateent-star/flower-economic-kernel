name: 'Social Preview Drift Guard'
description: 'Fail or warn CI when Open Graph, Twitter Card, canonical, redirect, image, or crawler-conditioned social preview state drifts.'
author: 'firstrateent-star'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  apify-token:
    description: 'Apify API token. Store it as a GitHub Actions secret, e.g. secrets.APIFY_TOKEN.'
    required: true
  urls:
    description: 'URLs to audit. Accepts a JSON array, comma-separated list, or one URL per line. Maximum 100.'
    required: true
  profiles:
    description: 'Crawler profiles to compare, comma-separated or JSON array.'
    required: false
    default: 'default,facebook,x,linkedin'
  check-images:
    description: 'Probe preview images for reachability/content type.'
    required: false
    default: 'true'
  fail-on:
    description: 'CI failure threshold: fail, risk, or never.'
    required: false
    default: 'fail'

outputs:
  pass:
    description: 'Number of PASS results.'
    value: ${{ steps.guard.outputs.pass }}
  risk:
    description: 'Number of RISK results.'
    value: ${{ steps.guard.outputs.risk }}
  fail:
    description: 'Number of FAIL results.'
    value: ${{ steps.guard.outputs.fail }}
  inconclusive:
    description: 'Number of INCONCLUSIVE measurements.'
    value: ${{ steps.guard.outputs.inconclusive }}
  worst-verdict:
    description: 'Worst verdict observed: PASS, RISK, FAIL, INCONCLUSIVE, or NONE.'
    value: ${{ steps.guard.outputs.worst-verdict }}
  results-json:
    description: 'Compact JSON array of Actor results.'
    value: ${{ steps.guard.outputs.results-json }}

runs:
  using: 'composite'
  steps:
    - name: Set up Apify CLI
      uses: apify/setup-apify-cli-action@v1.1.0
      with:
        token: ${{ inputs.apify-token }}

    - name: Run Social Preview Drift Guard
      id: guard
      shell: bash
      env:
        DRIFT_GUARD_URLS: ${{ inputs.urls }}
        DRIFT_GUARD_PROFILES: ${{ inputs.profiles }}
        DRIFT_GUARD_CHECK_IMAGES: ${{ inputs.check-images }}
        DRIFT_GUARD_FAIL_ON: ${{ inputs.fail-on }}
      run: node "$GITHUB_ACTION_PATH/run.js"

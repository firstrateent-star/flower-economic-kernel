name: Apify Store Observer

on:
  push:
    branches:
      - experiment/apify-store-observer
    paths:
      - '.github/workflows/apify-store-observer.yml'
      - 'experiments/apify-store-observer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query public Apify Store surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          base='https://api.apify.com/v2/store?username=firstrate&limit=1000&responseFormat=full'
          curl --fail-with-body --location --retry 3 --silent --show-error "${base}&includeUnrunnableActors=true" > evidence/all.json
          curl --fail-with-body --location --retry 3 --silent --show-error "${base}" > evidence/runnable-default.json
          curl --fail-with-body --location --retry 3 --silent --show-error "${base}&includeUnrunnableActors=true&allowsAgenticUsers=true" > evidence/agentic.json
          curl --fail-with-body --location --retry 3 --silent --show-error "${base}&includeUnrunnableActors=true&allowsAgenticUsers=false" > evidence/non-agentic.json

          for actor_name in social-preview-drift-guard-api google-maps-exact-match-guard; do
            actor_id="$(jq -r --arg n "$actor_name" '.data.items[] | select(.name == $n) | .id' evidence/all.json | head -n1)"
            if [ -n "$actor_id" ] && [ "$actor_id" != "null" ]; then
              curl --fail-with-body --location --retry 3 --silent --show-error \
                "https://api.apify.com/v2/actors/${actor_id}/runs?desc=1&limit=20" \
                > "evidence/${actor_name}-runs.json" || true
            fi
          done

      - name: Build evidence summary and public run details
        shell: python
        run: |
          import json
          import urllib.error
          import urllib.request
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          targets = ['social-preview-drift-guard-api', 'google-maps-exact-match-guard']

          def load_items(name):
              return json.loads(Path('evidence', name).read_text())['data']['items']

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Flower-Apify-Store-Observer/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      return res.status, json.loads(res.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      payload = json.loads(body)
                  except Exception:
                      payload = {'raw': body}
                  return exc.code, payload
              except Exception as exc:
                  return None, {'error': str(exc)}

          all_items = load_items('all.json')
          runnable = load_items('runnable-default.json')
          agentic = load_items('agentic.json')
          non_agentic = load_items('non-agentic.json')

          def by_name(items):
              return {item.get('name'): item for item in items}

          maps = {
              'all': by_name(all_items),
              'runnableDefault': by_name(runnable),
              'agentic': by_name(agentic),
              'nonAgentic': by_name(non_agentic),
          }

          summary = {
              'observedAt': datetime.now(timezone.utc).isoformat(),
              'source': 'Apify public Store and run APIs; no Apify token used',
              'username': 'firstrate',
              'targets': {},
          }

          for target in targets:
              item = maps['all'].get(target)
              target_summary = {
                  'presentInStoreAll': item is not None,
                  'presentInRunnableDefault': target in maps['runnableDefault'],
                  'presentInAgenticFilter': target in maps['agentic'],
                  'presentInNonAgenticFilter': target in maps['nonAgentic'],
                  'item': item,
                  'runListStatus': 'not_queried',
                  'runDetailStatusCounts': {},
                  'runOriginCounts': {},
                  'distinctRunUserIds': [],
                  'chargedRunCountVisible': 0,
                  'chargedEventTotalsVisible': {},
                  'runs': [],
              }

              runs_path = Path('evidence', f'{target}-runs.json')
              if runs_path.exists():
                  try:
                      run_payload = json.loads(runs_path.read_text())
                      runs = run_payload.get('data', {}).get('items', [])
                      target_summary['runListStatus'] = 'ok'
                      user_ids = set()
                      origins = Counter()
                      detail_statuses = Counter()
                      event_totals = Counter()
                      charged_run_count = 0

                      for run in runs:
                          run_id = run.get('id')
                          detail_status, detail_payload = get_json(f'https://api.apify.com/v2/actor-runs/{run_id}') if run_id else (None, {})
                          detail = detail_payload.get('data', {}) if isinstance(detail_payload, dict) else {}
                          detail_statuses[str(detail_status)] += 1
                          user_id = detail.get('userId') or run.get('userId')
                          if user_id:
                              user_ids.add(user_id)
                          origin = (detail.get('meta') or run.get('meta') or {}).get('origin')
                          if origin:
                              origins[origin] += 1
                          charged = detail.get('chargedEventCounts') or {}
                          if charged:
                              charged_run_count += 1
                              for event, count in charged.items():
                                  event_totals[event] += int(count or 0)

                          target_summary['runs'].append({
                              'id': run_id,
                              'status': detail.get('status') or run.get('status'),
                              'startedAt': detail.get('startedAt') or run.get('startedAt'),
                              'finishedAt': detail.get('finishedAt') or run.get('finishedAt'),
                              'userId': user_id,
                              'origin': origin,
                              'chargedEventCounts': charged,
                              'publicDetailHttpStatus': detail_status,
                          })

                      target_summary['runDetailStatusCounts'] = dict(detail_statuses)
                      target_summary['runOriginCounts'] = dict(origins)
                      target_summary['distinctRunUserIds'] = sorted(user_ids)
                      target_summary['chargedRunCountVisible'] = charged_run_count
                      target_summary['chargedEventTotalsVisible'] = dict(event_totals)
                  except Exception as exc:
                      target_summary['runListStatus'] = f'parse_error: {exc}'

              summary['targets'][target] = target_summary

          Path('evidence/summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(summary, indent=2, sort_keys=True))

      - name: Upload observation evidence
        uses: actions/upload-artifact@v4
        with:
          name: apify-store-observer
          path: evidence/
          retention-days: 30

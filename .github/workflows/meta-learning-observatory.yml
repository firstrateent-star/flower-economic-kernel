name: Flower Meta-Learning Observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'methodology/meta-learning/**'
      - 'methodology/mutation-ledger/**'
      - 'src/core/meta-learning.js'
      - 'scripts/meta-learning-observatory.mjs'
      - 'tests/meta-learning.test.js'
      - '.github/workflows/meta-learning-observatory.yml'

permissions:
  contents: read

jobs:
  meta-learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate meta-learning code
        run: |
          node --check src/core/meta-learning.js
          node --check scripts/meta-learning-observatory.mjs
          node --test tests/meta-learning.test.js
      - name: Run counterpressured historical plus prospective meta-learning Observatory
        run: node scripts/meta-learning-observatory.mjs
      - name: Validate epistemic boundaries
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/meta-learning-observatory-latest.json', 'utf8'));
          if (report.epistemicStatus !== 'counterpressured_meta_learning_with_prospective_internal_evidence_not_external_proof') throw new Error('Meta-learning report has incorrect epistemic status.');
          if (report.externalFlourishingClaim !== false) throw new Error('Internal evidence may not claim external flourishing.');
          if (report.flourishingOrientation?.scalarized !== false) throw new Error('Flourishing may not collapse into one scalar objective.');
          if (report.candidateRules.some((rule) => rule.eligibleForCanonicalPromotion === true)) throw new Error('Historical/prospective recurrence may not self-promote a canonical rule.');
          if (report.selfAudit?.negativeControlCount < 2) throw new Error('Counterpressured meta-learning requires represented negative controls.');
          if (report.selfAudit?.explicitMechanismRoleCoverage !== 1) throw new Error('Every episode must preserve applied/violated/inferred mechanism roles.');
          if (Number(report.selfAudit?.prospectiveCausalEpisodeCount ?? 0) < 1) throw new Error('The indexed-activation prospective intervention must be represented.');
          if (report.selfAudit?.risks?.some((risk) => risk.startsWith('causality_gap'))) throw new Error('Prospective causal evidence should clear the historical causality-gap flag for this bounded internal mechanism.');
          if (!report.selfAudit?.risks?.some((risk) => risk.startsWith('external_value_gap'))) throw new Error('External-value gap must remain until another system independently benefits.');
          if (report.nextPressure?.type !== 'CROSS_DOMAIN_TRANSFER_TEST') throw new Error('Prospective internal evidence should advance pressure to bounded cross-domain transfer.');
          console.log(JSON.stringify({
            nextPressure: report.nextPressure,
            selfAudit: report.selfAudit,
            topMechanisms: report.mechanismStats.slice(0, 8),
            violationStats: report.violationStats.slice(0, 8),
            candidateRules: report.candidateRules,
          }, null, 2));
          NODE
      - name: Upload meta-learning report
        uses: actions/upload-artifact@v4
        with:
          name: flower-meta-learning-observatory
          path: reports/meta-learning-observatory-latest.json
          if-no-files-found: error
          retention-days: 14

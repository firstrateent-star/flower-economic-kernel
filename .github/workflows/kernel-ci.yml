name: Flower Kernel CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'garden/**'
      - 'actors/**'
      - '.actor/**'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/kernel-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'garden/**'
      - 'actors/**'
      - '.actor/**'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/kernel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax checks
        run: npm run check
      - name: Validate Actor JSON configuration
        run: node -e "JSON.parse(require('fs').readFileSync('.actor/input_schema.json','utf8')); JSON.parse(require('fs').readFileSync('.actor/actor.json','utf8'));"
      - name: Kernel tests
        run: npm test
      - name: CLI canonical pressure smoke test
        run: |
          rm -f garden/state.json
          node src/runtime/cli.js status > /tmp/flower-status.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/flower-status.json','utf8')); if(x.pressure?.type!=='EXPAND') throw new Error('Expected canonical v3 challenger EXPAND, got '+JSON.stringify(x.pressure)); if(x.wake?.wake!==true) throw new Error('Autonomous challenger pressure should wake');"
      - name: Exhausted challenger returns to credential-free idempotent human sleep
        env:
          OPENAI_API_KEY: ''
        run: |
          rm -f garden/state.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const garden = JSON.parse(fs.readFileSync('garden/seed.json', 'utf8'));
          garden.status ??= {};
          garden.status.lastPressure = { type: 'EXPAND' };
          fs.writeFileSync('garden/state.json', `${JSON.stringify(garden, null, 2)}\n`);
          NODE
          node src/runtime/cli.js pulse > /tmp/flower-pulse-1.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/flower-pulse-1.json','utf8')); if(x.skipped!==true) throw new Error('Expected skipped first human-boundary pulse: '+JSON.stringify(x)); if(x.wake?.reason!=='human_membrane') throw new Error('Expected human_membrane wake decision'); if(Number(x.pulseCount??0)!==0) throw new Error('No-op pulse must not increment pulseCount');"
          cp garden/state.json /tmp/flower-state-before.json
          before="$(sha256sum garden/state.json | cut -d' ' -f1)"
          node src/runtime/cli.js pulse > /tmp/flower-pulse-2.json
          after="$(sha256sum garden/state.json | cut -d' ' -f1)"
          echo "FIRST_PULSE=$(cat /tmp/flower-pulse-1.json)"
          echo "SECOND_PULSE=$(cat /tmp/flower-pulse-2.json)"
          if [ "$before" != "$after" ]; then
            echo "Repeated human-boundary sleep mutated persisted Garden: $before -> $after"
            diff -u /tmp/flower-state-before.json garden/state.json || true
            exit 1
          fi
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/flower-pulse-2.json','utf8')); if(x.skipped!==true) throw new Error('Expected skipped second pulse'); if(x.stateChanged!==false) throw new Error('Repeated sleep must have no semantic state change'); if(x.statePersisted!==false) throw new Error('Repeated sleep must not rewrite Garden'); if(Number(x.pulseCount??0)!==0) throw new Error('Repeated sleep must not increment pulseCount');"

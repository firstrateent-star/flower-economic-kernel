name: Flower Kernel CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'garden/**'
      - 'actors/**'
      - 'package.json'
      - '.github/workflows/kernel-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'garden/**'
      - 'actors/**'
      - 'package.json'
      - '.github/workflows/kernel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax checks
        run: npm run check
      - name: Kernel tests
        run: npm test

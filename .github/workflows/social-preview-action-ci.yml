name: Social Preview Action CI

on:
  push:
    paths:
      - 'distribution/social-preview-drift-guard-action/**'
      - '.github/workflows/social-preview-action-ci.yml'
  pull_request:
    paths:
      - 'distribution/social-preview-drift-guard-action/**'
      - '.github/workflows/social-preview-action-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distribution/social-preview-drift-guard-action
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test

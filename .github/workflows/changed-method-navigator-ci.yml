name: Changed Method Navigator Preflight

on:
  push:
    branches:
      - experiment/changed-method-navigator-ci
    paths:
      - 'experiments/changed-method-navigator/**'
      - '.github/workflows/changed-method-navigator-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Run real IntelliJ PSI functional tests
        run: gradle -p experiments/changed-method-navigator test --stacktrace
      - name: Build plugin against real IntelliJ SDK
        run: gradle -p experiments/changed-method-navigator buildPlugin --stacktrace
      - name: Verify plugin compatibility
        id: verifier
        shell: bash
        run: |
          set +e
          gradle -p experiments/changed-method-navigator verifyPlugin --stacktrace 2>&1 | tee verifier.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build, test and verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changed-method-navigator-preflight
          path: |
            experiments/changed-method-navigator/build/distributions/*.zip
            experiments/changed-method-navigator/build/reports/tests/test/**
            verifier.log
          if-no-files-found: warn
      - name: Enforce verifier result
        if: steps.verifier.outputs.status != '0'
        run: exit 1

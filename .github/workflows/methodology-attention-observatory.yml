name: Flower Methodology Attention Observatory

on:
  push:
    paths:
      - 'research/methodology/methodology-attention-gate.js'
      - 'tests/methodology-attention-gate.test.js'
      - 'scripts/methodology-attention-observatory.mjs'
      - '.github/workflows/methodology-attention-observatory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  methodology-attention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate attention gate
        run: |
          node --check research/methodology/methodology-attention-gate.js
          node --check scripts/methodology-attention-observatory.mjs
          node --test tests/methodology-attention-gate.test.js
      - name: Run methodology attention Observatory
        run: node scripts/methodology-attention-observatory.mjs
      - name: Guard canonical boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/methodology-attention-observatory-latest.json', 'utf8'));
          if (report.canonicalMethodologyVersion !== '2026-08-30.integrated-v5') throw new Error('Shadow audit may not mutate canon.');
          if (report.claims.candidateResidencyIsCanonical !== false) throw new Error('Residency audit may not self-promote.');
          if (report.claims.methodologyImprovementVerified !== false) throw new Error('One audit run is not methodology-improvement proof.');
          if (report.counts.HOT_CANDIDATE < 1) throw new Error('Expected at least one live candidate.');
          if (report.counts.COLD_REFERENCE < 1) throw new Error('Expected cold pruning.');
          if (report.counts.MERGE_CANDIDATE < 1) throw new Error('Expected duplicate/merge pruning.');
          console.log(JSON.stringify({ recommendation: report.recursion.recommendation, counts: report.counts }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: flower-methodology-attention-observatory
          path: reports/methodology-attention-observatory-latest.json
          retention-days: 14
